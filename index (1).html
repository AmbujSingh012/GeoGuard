<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boundary Watch — Illegal Mining Detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6FD; --panel:#FFFFFF; --panel2:#FBFAFF; --line:#E3DEF7;
  --paper:#FFFFFF; --ink:#1A1533; --dim:#6B6690;
  --amber:#E8A200; --rust:#E5473A; --moss:#12A454; --water:#0891A8;
  --violet:#7C3AED; --pink:#E11D74;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--ink); font-family:'Inter',system-ui,sans-serif;
  display:flex; min-height:100%; position:relative;
}

/* Animated satellite field */
#satfield{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none}
#satfield .sat{position:absolute; font-size:26px; opacity:.55; filter:drop-shadow(0 2px 4px rgba(124,58,237,.25))}
#satfield .trail{position:absolute; height:1px; background:linear-gradient(90deg, transparent, var(--tc, #7C3AED55), transparent); opacity:.5}
#satfield .dot{position:absolute; width:5px; height:5px; border-radius:50%; opacity:.35}
@keyframes flyRight{from{transform:translate(-10vw,0) rotate(20deg)} to{transform:translate(110vw,-6vh) rotate(20deg)}}
@keyframes flyLeft{from{transform:translate(110vw,0) rotate(200deg)} to{transform:translate(-10vw,8vh) rotate(200deg)}}
@keyframes flyDiag{from{transform:translate(-10vw,110vh) rotate(-35deg)} to{transform:translate(110vw,-15vh) rotate(-35deg)}}
@keyframes twinkle{0%,100%{opacity:.15} 50%{opacity:.6}}
.side, .main{position:relative; z-index:1}
.side{background:rgba(255,255,255,.88); backdrop-filter:blur(6px)}
.main{background:transparent}
h1,.brand,.section-title,.card .k,.stat-inline .si b{font-family:'Space Grotesk',system-ui,sans-serif}
.mono{font-family:'Space Mono',monospace}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

/* Sidebar */
.side{
  width:240px; flex:0 0 240px; background:var(--panel); border-right:1px solid var(--line);
  padding:22px 14px; display:flex; flex-direction:column; gap:4px;
}
.brand{font-size:18px; font-weight:700; letter-spacing:-.3px; margin:2px 4px 4px; display:flex; align-items:center; gap:9px}
.brand .dot{width:12px;height:12px;border-radius:5px; background:linear-gradient(135deg,var(--violet),var(--pink)); box-shadow:0 0 14px rgba(139,92,246,.7)}
.tag{font-size:11.5px; color:var(--dim); margin:0 4px 20px; line-height:1.4}
.step{
  text-align:left; background:none; border:none; color:var(--dim); font-family:'Inter',inherit; font-size:13.5px; font-weight:600;
  padding:10px 12px; border-radius:14px; cursor:pointer; display:flex; gap:10px; align-items:center; transition:transform .15s ease;
}
.step .n{font-family:'Space Mono',monospace; font-size:11px; width:16px; color:var(--dim)}
.step.active{background:linear-gradient(135deg,var(--violet),var(--pink)); color:#fff; box-shadow:0 4px 16px rgba(255,92,168,.35)}
.step.active .n{color:#fff}
.step.done .n{color:var(--moss)}
.step:hover{color:var(--ink); transform:translateX(2px)}
.sidefoot{margin-top:auto; font-size:11px; color:var(--dim); padding:12px 6px; border-top:1px solid var(--line)}

/* Main */
.main{flex:1; overflow-y:auto; padding:32px 36px 60px; max-width:1000px}
.crumb{font-size:11.5px; color:var(--pink); font-weight:700; letter-spacing:.3px; margin-bottom:8px; text-transform:uppercase}
h1{font-size:30px; margin:0 0 6px; font-weight:700; letter-spacing:-.5px}
.sub{color:var(--dim); font-size:13.5px; margin:0 0 24px; max-width:62ch; line-height:1.55}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:22px; margin-bottom:18px; box-shadow:0 10px 30px rgba(124,58,237,.08)}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.card{background:var(--panel2); border:1px solid var(--line); border-radius:16px; padding:16px; position:relative; overflow:hidden; box-shadow:0 6px 18px rgba(124,58,237,.10); transition:transform .15s ease, border-color .15s ease}
.card::before{content:'';position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--violet),var(--water))}
.card[onclick]{cursor:pointer}
.card[onclick]:hover{transform:translateY(-2px); border-color:var(--violet)}
.card .k{font-size:28px; font-weight:700}
.card .l{font-size:11px; color:var(--dim); margin-top:6px; font-weight:600; letter-spacing:.2px}
.btn{
  background:linear-gradient(135deg,var(--violet),var(--pink)); color:#fff; border:none; padding:12px 22px; border-radius:999px;
  font-family:'Inter',inherit; font-size:13.5px; font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(139,92,246,.35); transition:transform .15s ease, box-shadow .15s ease;
}
.btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 8px 22px rgba(255,92,168,.45)}
.btn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none}
.btn.ghost{background:transparent; border:2px solid var(--line); color:var(--ink); box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--violet); color:var(--ink); background:transparent; transform:translateY(-2px)}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.pill{font-size:11.5px; padding:5px 12px; border-radius:999px; border:1.5px solid var(--line); color:var(--dim); font-weight:600; white-space:nowrap; display:inline-flex; align-items:center; gap:5px}
.pill.high{border-color:var(--rust); color:var(--rust); background:rgba(255,107,91,.1)}
.pill.med{border-color:var(--amber); color:var(--amber); background:rgba(255,210,63,.1)}
.pill.ok{border-color:var(--moss); color:var(--moss); background:rgba(156,255,107,.1)}

.section-title{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; background:linear-gradient(90deg,var(--pink),var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent; margin:28px 0 10px}
.section-title:first-of-type{margin-top:4px}
.actions-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px}
.panel.compact{padding:18px 22px}
.stat-inline{display:flex; gap:18px; flex-wrap:wrap; margin-top:10px}
.stat-inline .si{display:flex; flex-direction:column}
.stat-inline .si b{font-size:18px}
.stat-inline .si span{font-size:10.5px; color:var(--dim); font-weight:600; margin-top:2px}
.watchlist{display:flex; flex-direction:column; gap:10px}
.watch-row{display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:14px 16px; flex-wrap:wrap; box-shadow:0 4px 14px rgba(124,58,237,.08)}
.watch-row .who{min-width:190px; flex:1 1 190px}
.watch-row .who strong{font-size:13.5px; display:block; font-weight:600}
.watch-row .who span{font-size:11.5px; color:var(--dim); display:block; margin-top:2px}
.watch-row .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:2 1 320px}
.watch-row .src{font-size:11px; color:var(--dim); white-space:nowrap; background:var(--bg); border:1px solid var(--line); padding:5px 10px; border-radius:999px}
.watch-row .action{flex:0 0 auto; margin-left:auto}
.watch-row .action .sub{white-space:nowrap}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px}
.field label{font-size:12px; color:var(--dim); font-weight:600}
.field input, .field select, .field textarea{
  background:var(--bg); border:1.5px solid var(--line); color:var(--ink); padding:10px 12px; border-radius:12px; font-family:'Inter',inherit; font-size:13px;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--violet)}
.dropzone{
  border:2px dashed var(--line); border-radius:16px; padding:24px; text-align:center; color:var(--dim); font-size:12.5px; cursor:pointer; font-weight:600; transition:border-color .15s ease;
}
.dropzone:hover{border-color:var(--violet)}
.dropzone.filled{border-color:var(--moss); color:var(--moss); border-style:solid; background:rgba(156,255,107,.06)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:14px}
table{width:100%; border-collapse:collapse; font-size:12.5px}
th{text-align:left; color:var(--dim); font-weight:700; padding:10px 8px; border-bottom:1.5px solid var(--line); font-size:11px; text-transform:uppercase; letter-spacing:.2px}
td{padding:11px 8px; border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tr[onclick]:hover td{background:rgba(139,92,246,.08)}
.status-badge{font-size:11px; padding:4px 10px; border-radius:999px}
.disclaimer{font-size:11.5px; color:var(--dim); border-left:3px solid var(--amber); padding:10px 14px; margin-top:14px; background:var(--panel2); border-radius:0 12px 12px 0}

/* Map */
.mapwrap{position:relative; height:340px; border-radius:16px; overflow:hidden; border:1px solid var(--line)}
.mapwrap svg{width:100%; height:100%; display:block; background:#FBFAFF}
.legend{position:absolute; bottom:12px; left:12px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:11px; display:flex; flex-direction:column; gap:6px; box-shadow:0 4px 14px rgba(124,58,237,.1)}
.legend span{display:flex; align-items:center; gap:7px; font-weight:600}
.sw{width:10px;height:10px;border-radius:3px; display:inline-block}

.imgpair{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
.imgbox{background:linear-gradient(135deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:16px; height:120px; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:11px; font-weight:600; position:relative; overflow:hidden}
.imgbox .cap{position:absolute; bottom:8px; left:10px; font-size:10px; color:var(--dim); font-weight:500}

.spin{width:14px;height:14px;border:2px solid var(--line); border-top-color:var(--pink); border-radius:50%; animation:sp .7s linear infinite; display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

.audit{font-size:12px; color:var(--dim); display:flex; gap:8px; padding:7px 0; border-bottom:1px dashed var(--line)}
.audit:last-child{border-bottom:none}

@media (max-width:820px){
  body{flex-direction:column}
  .side{width:100%; flex-direction:row; overflow-x:auto; padding:10px; gap:8px; align-items:center}
  .step{white-space:nowrap}
  .sidefoot{display:none}
  .main{padding:22px 18px 50px; max-width:100%}
  .grid, .two, .imgpair{grid-template-columns:1fr}
}
:root:not([data-theme="light"]){ }
@media print{
  #satfield{display:none}
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{position:absolute; left:0; top:0; width:100%; margin:0}
  #printArea .panel{box-shadow:none; border:1px solid #ccc}
}
</style>
</head>
<body>

<div id="satfield">
  <div class="sat" style="top:5%; font-size:58px; animation:flyRight 26s linear infinite; animation-delay:0s;">🛰️</div>
  <div class="sat" style="top:16%; font-size:44px; animation:flyLeft 32s linear infinite; animation-delay:-6s;">🛰️</div>
  <div class="sat" style="top:28%; font-size:64px; animation:flyRight 22s linear infinite; animation-delay:-3s;">🛰️</div>
  <div class="sat" style="top:40%; font-size:50px; animation:flyDiag 30s linear infinite; animation-delay:-10s;">🛰️</div>
  <div class="sat" style="top:52%; font-size:70px; animation:flyLeft 24s linear infinite; animation-delay:-14s;">🛰️</div>
  <div class="sat" style="top:8%; font-size:52px; animation:flyDiag 36s linear infinite; animation-delay:-18s;">🛰️</div>
  <div class="sat" style="top:64%; font-size:46px; animation:flyRight 28s linear infinite; animation-delay:-8s;">🛰️</div>
  <div class="sat" style="top:76%; font-size:60px; animation:flyLeft 20s linear infinite; animation-delay:-4s;">🛰️</div>

  <div class="dot" style="top:85%; left:35%; background:#7C3AED; animation:twinkle 3s ease-in-out infinite 2s"></div>
  <div class="dot" style="top:45%; left:90%; background:#E11D74; animation:twinkle 4s ease-in-out infinite 1.2s"></div>
  <div class="dot" style="top:5%; left:80%; background:#0891A8; animation:twinkle 3.5s ease-in-out infinite .3s"></div>

</div>

<nav class="side" id="side">
  <div class="brand"><span class="dot"></span>Boundary Watch</div>
  <div class="tag">Illegal Mining Detection — Monitoring Platform</div>
  <div id="stepList"></div>
  <div class="sidefoot">Decision-support tool.<br>Not a legal determination.<br><a href="#" onclick="if(confirm('Clear all saved cases and progress on this device?')){localStorage.removeItem(SAVE_KEY); location.reload();} return false;" style="color:var(--dim)">Reset saved data</a></div>
</nav>

<main class="main" id="main"></main>

<script>
const NAV = [
  {id:'dash', label:'Dashboard'},
  {id:'watch', label:'Satellite Watch'},
  {id:'lease', label:'Leases'},
  {id:'alertsq', label:'Alerts'},
  {id:'cases', label:'Cases'}
];

const steps = [
  {id:'upload', label:'Upload imagery'},
  {id:'analysis', label:'Run analysis'},
  {id:'result', label:'Change result'},
  {id:'alert', label:'Alert generated'},
  {id:'case', label:'Create case'},
  {id:'inspect', label:'Field inspection'},
  {id:'report', label:'Case report'}
];

const SAVE_KEY = 'boundarywatch_state_v1';

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) Object.assign(state, JSON.parse(raw));
  }catch(e){ /* storage unavailable, continue with defaults */ }
}
function saveState(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}

// Seed data for automated satellite monitoring. In production this table would be
// written by a scheduled job polling a provider's subscription API (e.g. Planet's
// Subscriptions API or Sentinel Hub Statistical API), not typed by hand.
const WATCH_SEED = [
  {khasra:'412/2', owner:'Shivam Minerals Pvt. Ltd.', village:'Rasoolabad, Bhognipur', source:'PlanetScope (3m, daily)', hoursAgo:6, changeDetected:true, risk:'HIGH', type:'Boundary excavation'},
  {khasra:'145/1', owner:'Bithoor Riverbed Minerals', village:'Bithoor', source:'PlanetScope (3m, daily)', hoursAgo:9, changeDetected:true, risk:'MEDIUM', type:'Unauthorized access point', note:'Modelled on a real NGT case (UP–Haryana border, Karnal, 2022): ~0.74 ha at ~2m depth, ~14,800 m³ extracted via unpermitted entry/exit points.'},
  {khasra:'77/1', owner:'Ganga Aggregates Co.', village:'Madhopur, Sivrajpur', source:'PlanetScope (3m, daily)', hoursAgo:14, changeDetected:false, risk:null},
  {khasra:'88/3', owner:'Narval Stone Crushers', village:'Narval', source:'PlanetScope (3m, daily)', hoursAgo:19, changeDetected:false, risk:null},
  {khasra:'210/4', owner:'Trimurti Quarries', village:'Chaubepur', source:'Sentinel-2 (10m, ~5-day)', hoursAgo:38, changeDetected:false, risk:null},
  {khasra:'63/2', owner:'Maharajpur Aggregates', village:'Maharajpur', source:'Sentinel-2 (10m, ~5-day)', hoursAgo:62, changeDetected:false, risk:null}
];

const state = {
  current: 'dash',
  furthest: 0,
  leaseSelected: false,
  beforeUploaded: false,
  afterUploaded: false,
  analysisRun: false,
  caseCreated: false,
  officer: '',
  status: 'NEW',
  inspectionDone: false,
  auditLog: [],
  cases: [],
  leaseFilter: null,
  alertFilter: null,
  currentKhasra: '412/2',
  currentCaseId: 'CASE-2026-412-2',
  watch: WATCH_SEED.map(w=>({...w})),
  lastGlobalCheck: null,
  checking: false
};

function runSatelliteCheck(){
  state.checking = true;
  render();
  setTimeout(()=>{
    state.watch.forEach(w=>{
      const dailySource = w.source.indexOf('daily')>-1;
      // PlanetScope revisits ~daily, so a run always brings it current.
      // Sentinel-2 only refreshes once its ~5-day cycle has actually elapsed.
      if(dailySource || w.hoursAgo >= 120){
        w.hoursAgo = 0;
        w.changeDetected = Math.random() < 0.18;
        w.risk = w.changeDetected ? (Math.random()<0.4?'HIGH':'MEDIUM') : null;
      }
    });
    state.watch[0].changeDetected = true; state.watch[0].risk = 'HIGH'; // keep the demo lease's flagged change visible
    state.lastGlobalCheck = new Date().toLocaleString();
    state.checking = false;
    log('Ran scheduled satellite check across '+state.watch.length+' leases');
    render();
  }, 1100);
}

const LEASE_DB = {
  '412/2': {owner:'Shivam Minerals Pvt. Ltd.', mineral:'Sand & Bajri', district:'Kanpur Dehat', tehsil:'Bhognipur', village:'Rasoolabad', khasra:'412/2', area:'8.5 ha', valid:'12 Mar 2023 – 11 Mar 2027', active:true},
  '77/1': {owner:'Ganga Aggregates Co.', mineral:'Stone', district:'Kanpur Dehat', tehsil:'Sivrajpur', village:'Madhopur', khasra:'77/1', area:'5.2 ha', valid:'05 Jun 2022 – 04 Jun 2027', active:true},
  '210/4': {owner:'Trimurti Quarries', mineral:'Sand', district:'Kanpur Nagar', tehsil:'Chaubepur', village:'Chaubepur', khasra:'210/4', area:'3.9 ha', valid:'18 Nov 2021 – 17 Nov 2026', active:true},
  '88/3': {owner:'Narval Stone Crushers', mineral:'Stone', district:'Kanpur Dehat', tehsil:'Narval', village:'Narval', khasra:'88/3', area:'6.1 ha', valid:'02 Feb 2024 – 01 Feb 2029', active:true},
  '145/1': {owner:'Bithoor Riverbed Minerals', mineral:'Sand & Bajri', district:'Kanpur Nagar', tehsil:'Bithoor', village:'Bithoor', khasra:'145/1', area:'4.4 ha', valid:'22 Aug 2023 – 21 Aug 2028', active:true},
  '63/2': {owner:'Maharajpur Aggregates', mineral:'Stone', district:'Kanpur Dehat', tehsil:'Maharajpur', village:'Maharajpur', khasra:'63/2', area:'2.8 ha', valid:'10 Apr 2022 – 09 Apr 2027', active:true},
  '55/6': {owner:'Kanpur Riverbed Minerals', mineral:'Sand', district:'Kanpur Nagar', tehsil:'Bithoor', village:'Ratanpur', khasra:'55/6', area:'3.0 ha', valid:'01 Jan 2019 – 31 Dec 2024', active:false}
};

const RESULT_DB = {
  '412/2': {activity:'Probable Excavation', changedArea:14.0, inside:10.0, outside:4.0, pctOutside:28.6, confidence:0.86, risk:'HIGH'},
  '145/1': {activity:'Probable Excavation (access road + pit)', changedArea:1.1, inside:0.4, outside:0.7, pctOutside:63.6, confidence:0.79, risk:'MEDIUM'}
};
function resultFor(khasra){
  return RESULT_DB[khasra] || {activity:'No significant change', changedArea:0.2, inside:0.2, outside:0.0, pctOutside:0, confidence:0.93, risk:'LOW'};
}

let LEASE = LEASE_DB['412/2'];
let RESULT = resultFor('412/2');

function selectLease(khasra){
  LEASE = LEASE_DB[khasra];
  RESULT = resultFor(khasra);
  state.currentKhasra = khasra;
  state.leaseSelected = true;
  state.beforeUploaded = false;
  state.afterUploaded = false;
  state.analysisRun = false;
  state.caseCreated = false;
  state.officer = '';
  state.status = 'NEW';
  state.inspectionDone = false;
  state.currentCaseId = 'CASE-2026-'+khasra.replace('/','-');
  log('Opened lease '+khasra+' for investigation');
  goTo('upload');
}

const ALERTS = [
  {lease:'Shivam Minerals Pvt. Ltd.', khasra:'412/2', village:'Rasoolabad, Bhognipur', risk:'HIGH', outside:'4.0 ha', date:'02 Sep 2026', status:'New', primary:true},
  {lease:'Bithoor Riverbed Minerals', khasra:'145/1', village:'Bithoor', risk:'MEDIUM', outside:'0.7 ha', date:'30 Aug 2026', status:'Under verification'},
  {lease:'Ganga Aggregates Co.', khasra:'77/1', village:'Madhopur, Sivrajpur', risk:'MEDIUM', outside:'1.2 ha', date:'29 Aug 2026', status:'Under verification'},
  {lease:'Trimurti Quarries', khasra:'210/4', village:'Chaubepur', risk:'LOW', outside:'0.4 ha', date:'21 Aug 2026', status:'Under verification'},
  {lease:'Narval Stone Crushers', khasra:'88/3', village:'Narval', risk:'MEDIUM', outside:'1.8 ha', date:'15 Aug 2026', status:'Closed — no violation'}
];

function activeAlerts(){ return ALERTS.filter(a=>a.status!=='Closed — no violation'); }
function highRiskActiveAlerts(){ return activeAlerts().filter(a=>a.risk==='HIGH'); }
function sumHa(arr){ return arr.reduce((t,a)=>t+parseFloat(a.outside),0).toFixed(1); }

const LEASES = Object.values(LEASE_DB);

function filterLeases(){
  const q = document.getElementById('leaseSearch').value.toLowerCase();
  document.querySelectorAll('#leaseTable tr[data-row]').forEach(row=>{

function exportGeoJSON(){
  const geo = {type:'FeatureCollection', features:[
    {type:'Feature', properties:{name:'Lease boundary', owner:LEASE.owner, khasra:LEASE.khasra}, geometry:{type:'Polygon', coordinates:[[[80.0090,26.2910],[80.0140,26.2916],[80.0148,26.2875],[80.0110,26.2856],[80.0086,26.2868],[80.0090,26.2910]]]}},
    {type:'Feature', properties:{name:'Detected change', area_ha:RESULT.outside}, geometry:{type:'Polygon', coordinates:[[[80.0118,26.2900],[80.0142,26.2903],[80.0145,26.2882],[80.0122,26.2872],[80.0110,26.2888],[80.0118,26.2900]]]}}
  ]};
  const blob = new Blob([JSON.stringify(geo,null,2)], {type:'application/geo+json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lease_'+LEASE.khasra.replace('/','-')+'_boundary.geojson';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  log('Exported lease + detected-change boundary as GeoJSON');
}

function log(action){
  state.auditLog.push({t:new Date().toLocaleTimeString(), a:action, u:'demo.officer'});
  saveState();
}

function downloadReportPDF(){
  log('Downloaded case report as PDF ('+state.currentCaseId+')');
  render();
  window.print();
}

function goTo(id, filter){
  const idx = steps.findIndex(s=>s.id===id);
  if(idx > state.furthest) state.furthest = idx;
  state.current = id;
  if(id==='lease') state.leaseFilter = filter || null;
  if(id==='alertsq') state.alertFilter = filter || null;
  render();
}

function renderSidebar(){
  const el = document.getElementById('stepList');
  const navHtml = NAV.map(n=>{
    const cls = n.id===state.current ? 'active' : '';
    return `<button class="step ${cls}" onclick="goTo('${n.id}')"><span class="n">●</span>${n.label}</button>`;
  }).join('');
  let workHtml = '';
  if(state.leaseSelected){
    const activeIdx = steps.findIndex(x=>x.id===state.current);
    workHtml = `<div class="sidefoot" style="border-top:1px solid var(--line); border-bottom:none; margin:14px 0 4px; padding:0 6px 8px">Active case — Khasra ${LEASE.khasra}</div>` +
      steps.map((s,i)=>{
        const cls = s.id===state.current ? 'active' : (i < activeIdx ? 'done' : '');
        return `<button class="step ${cls}" onclick="goTo('${s.id}')"><span class="n">${i<activeIdx?'✓':String(i+1).padStart(2,'0')}</span>${s.label}</button>`;
      }).join('');
  }
  el.innerHTML = navHtml + workHtml;
}

}

          <option ${state.status==='NO_VIOLATION'?'selected':''}>NO_VIOLATION</option>
        </select>
      </div>
      <button class="btn" ${!state.inspectionDone?'disabled':''} onclick="goTo('report')">Generate case report →</button>
    </div>
  `;

  s.report = `
    <div class="crumb">Report</div>
    <h1>Case report</h1>
    <div id="printArea">
    <div class="panel" style="background:var(--paper); color:#1A1F1B">
      <div class="row" style="justify-content:space-between; border-bottom:1px solid #ccc4a8; padding-bottom:12px; margin-bottom:12px">
        <div>
          <strong>Suspected Unauthorized Activity — Case Report</strong>
          <div style="font-size:11px; margin-top:2px">Directorate of Geology and Mining, Uttar Pradesh · Minor Mineral (MMDR Act, 1957)</div>
        </div>
        <span class="mono" style="font-size:11px">${state.currentCaseId} · Generated ${new Date().toLocaleDateString()}</span>
      </div>
      <div class="two" style="font-size:12.5px">
        <div>
          <p><strong>Location:</strong> ${LEASE.village}, ${LEASE.tehsil}, ${LEASE.district}</p>
          <p><strong>Khasra no.:</strong> ${LEASE.khasra}</p>
          <p><strong>Lease owner:</strong> ${LEASE.owner}</p>
          <p><strong>Mineral:</strong> ${LEASE.mineral}</p>
          <p><strong>Lease validity:</strong> ${LEASE.valid}</p>
        </div>
        <div>
          <p><strong>Detected activity:</strong> ${RESULT.activity}</p>
          <p><strong>Period compared:</strong> 14 Jan 2026 → 02 Sep 2026</p>
          <p><strong>Changed area:</strong> ${RESULT.changedArea} ha (${RESULT.outside} ha outside lease)</p>
          <p><strong>Model confidence:</strong> ${(RESULT.confidence*100).toFixed(0)}%</p>
          <p><strong>Assigned officer:</strong> ${state.officer}</p>
          <p><strong>Case status:</strong> ${state.status}</p>
        </div>
      </div>
      <div style="margin-top:10px; padding:10px; border:1px dashed #b0a888; font-size:11.5px">
        AI and geospatial outputs are decision-support information. Final determination requires authorized field verification.
      </div>
      <p style="margin-top:10px; font-size:11px; color:#4a4470">For reference: a comparably large violation near river Son, Sonbhadra, drew a combined ₹15.96 crore NGT fine on two firms in 2023 — this case's scale (${RESULT.outside} ha outside lease) sits in a similar high-severity range.</p>
    </div>
    <div class="panel" style="margin-top:14px">
      <strong style="font-size:14px">Audit history</strong>
      <div style="margin-top:8px">
        ${state.auditLog.map(a=>`<div class="audit"><span class="mono" style="width:70px; color:var(--dim)">${a.t}</span><span>${a.a}</span></div>`).join('') || '<span class="sub">No actions recorded yet.</span>'}
      </div>
    </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" onclick="downloadReportPDF()">⬇ Download PDF report</button>
      <button class="btn ghost" onclick="goTo('dash')">Back to dashboard</button>
    </div>
  `;

  return s;
}

function runAnalysis(){
  const btn = document.getElementById('analyzeBtn');
  const status = document.getElementById('analyzeStatus');
  btn.disabled = true;
  status.innerHTML = '<span class="spin"></span> Aligning images, detecting change…';
  setTimeout(()=>{
    document.getElementById('overlayBox').innerHTML = 'Change overlay<span class="cap">generated</span>';
    document.getElementById('overlayBox').style.color = 'var(--rust)';
    status.textContent = 'Done.';
    state.analysisRun = true;
    log('Ran change-detection analysis: '+RESULT.changedArea.toFixed(1)+' ha changed, '+RESULT.outside.toFixed(1)+' ha outside lease');
    render();
  }, 1400);
}

function render(){
  renderSidebar();
  document.getElementById('main').innerHTML = screens()[state.current];
  saveState();
}
loadState();
if(state.currentKhasra && LEASE_DB[state.currentKhasra]){
  LEASE = LEASE_DB[state.currentKhasra];
  RESULT = resultFor(state.currentKhasra);
}
render();
</script>
</body>
</html>
